serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

deployment:
  name: mdai-fidelity-validator
  replicas: 1
  annotations: {}
  podAnnotations: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []

image:
  repository: ghcr.io/mydecisive/mdai-fidelity-validator
  tag: 0.1.0
  pullPolicy: IfNotPresent

env:
  adminAddr: ":8080"
  ingestAddr: ":8126"
  datadogAPIAddr: ":8081"
  retention: "30m"
  receiverUpstream: ""
  exporterUpstream: ""

service:
  name: mdai-fidelity-validator
  type: ClusterIP
  ports:
    - name: admin
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: ingest
      port: 8126
      targetPort: 8126
      protocol: TCP
    - name: dd-api
      port: 8081
      targetPort: 8081
      protocol: TCP
